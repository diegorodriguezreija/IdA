# Mapa de Componentes de IdA: especificación del diseño por Componentes.
#
# Es la fuente de verdad de dónde vive cada Componente (destino) y dónde está hoy (hoy).
# tests/test_mapa_componentes.py comprueba que el código montado coincide con «hoy» en cada mundo,
# y doc-repositorio/06_MAPA_DE_COMPONENTES.md se genera desde aquí (herramientas/mapa_componentes.py).
#
# Reglas de cambio (AGENTS.md):
# - Mover un Componente en el código obliga a actualizar «hoy» (y «hoy_en») en el mismo PR.
# - Cambiar «destino», «clase» o «registran» exige una decisión de docs/DISENO_COMPONENTES.md
#   (campo «decision») aprobada por el autor. Nunca se cambia para que pase un test.
#
# Campos:
#   nombre       clase Python del Componente, la estrategia (Definicion) o la biblioteca
#   tipo         componente | estrategia | biblioteca
#   clase        general | opcional (general que solo monta quien lo registra) | cuerpo | mundo
#   dueno        mundo o familia de cuerpos (clase mundo o cuerpo)
#   destino      dónde debe vivir: CORE.Sentir, CORE.Regulacion, CORE.Actuar, S1.Sentir... o «cuerpo» (biblioteca)
#   hoy          dónde está hoy: una ubicación como destino, «fuera:<fichero>» si aún no es un Componente,
#                o «» si todavía no existe
#   hoy_en       en qué mundos se monta hoy («todos» o lista); por defecto, todos (general) o [dueno] (mundo)
#   registran    mundos que lo registrarán (clase opcional o cuerpo)
#   sustituye    estrategia general a la que sustituye en su mundo
#   paso         paso del plan que lo lleva a su destino (vacío si ya está)
#   decision     D<n> de docs/DISENO_COMPONENTES.md, o «previo» si es anterior a la reorganización
#   preatentivo  corre en la preatención (D5)
#   aprende      tiene plasticidad (D6)

