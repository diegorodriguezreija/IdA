[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-identidad-artificial"
version = "1.0.0"
description = "Framework bioinspirado en Python: agentes con cuerpo, carácter y linaje que viven en distintos mundos."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "ida/mundos/ajedrez/LICENSE", "ida/mundos/ajedrez/LICENCIA.md"]
authors = [{ name = "Diego Rodriguez Reija" }]
keywords = ["cognitive architecture", "embodied agents", "ports and adapters", "Crafter", "artificial life"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# El framework base no tiene dependencias: cada mundo trae las suyas como extra.
dependencies = []

[project.optional-dependencies]
crafter = ["crafter>=1.8"]
snake = ["playwright>=1.40"]
ajedrez = ["chess>=1.10"]   # GPL-3.0-or-later: solo se importa en ida/mundos/ajedrez/ (ver NOTICE)
observabilidad = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# Los tres mundos con dependencias, para probarlo todo (README). Debe ser la unión de crafter, snake y ajedrez
# (lo comprueba tests/test_api_v1.py). Snake necesita además `python -m playwright install chromium`.
# Sin [observabilidad]: OTel solo sirve con la pila de infra/ (Docker) y añade unos diez paquetes que el usuario casual no usa.
todos = ["crafter>=1.8", "playwright>=1.40", "chess>=1.10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ida = "ida.__main__:main"

# Todos los paquetes de ida/ (cada carpeta con __init__.py). web/ no es un paquete: va como datos de ida.telemetria.
# tests/test_empaquetado.py comprueba que esta configuración incluye cada paquete y cada fichero que se lee al correr.
[tool.setuptools]
# Los datos son solo los de [tool.setuptools.package-data]: con include-package-data (el valor por defecto), setuptools en
# Windows cruza las rutas del manifiesto («/») con las de los paquetes («\») y avisa de que ida.mundos.ajedrez e
# ida.telemetria.web.* no están en `packages`, aunque los copia (lo vio el autor en su prueba de usuario del 26/11/2026).
include-package-data = false

[tool.setuptools.packages.find]
include = ["ida", "ida.*"]
exclude = ["ida.telemetria.web", "ida.telemetria.web.*"]
namespaces = false

[tool.setuptools.package-data]
"ida.telemetria" = ["web/*", "web/**/*"]           # la aplicación: index, vistas, lab, componentes, i18n, sprites (O12)
"ida.mundos.ajedrez" = ["*.md", "LICENSE"]         # licencia del rival (NOTICE)
"ida.mundos.crafter" = ["*.json"]                  # manuales de Crafter (adaptador.cargar_manual)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = [
    "E741",   # nombres cortos como «l» (lugar) en comprensiones: legibles en el contexto
    "B027",   # Mundo.cerrar es un gancho opcional, vacío a propósito
]

[tool.ruff.lint.per-file-ignores]
"ida/sistemas/s2.py" = ["B007"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
# Las librerías de los mundos (crafter, playwright, chess) no publican tipos completos.
ignore_missing_imports = true
