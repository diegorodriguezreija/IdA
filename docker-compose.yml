# Pila de observabilidad de IdA: IdA → OpenTelemetry Collector → Jaeger (trazas) y Prometheus (métricas) → Grafana.
#
#   docker compose up --build                 # IdA vive en el mundo de archivos y lo envía todo
#   docker compose run --rm ida --mundo crafter --latidos 600 --otel --ver
#
# Panel de IdA: http://localhost:8000 · Grafana: http://localhost:3000 · Jaeger: http://localhost:16686 · Prometheus: http://localhost:9090
# Para enviar desde IdA en el anfitrión (sin contenedor): docker compose up otel-collector jaeger prometheus grafana
# y después: python -m ida --mundo minimo --otel   (usa http://localhost:4318)

services:
  ida:
    build:
      context: .
      target: ida
    command: ["--mundo", "archivos", "--latidos", "3000", "--generaciones", "5", "--semilla", "1", "--otel", "--ver", "--cada", "50"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ida-datos:/app/datos
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ida.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  ida-datos:
